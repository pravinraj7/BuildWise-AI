version: "3.9"

services:
  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: buildwise_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-buildwise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-buildwise_secret}
      POSTGRES_DB: ${POSTGRES_DB:-buildwise_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buildwise"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - buildwise_net

  # ── ChromaDB ───────────────────────────────────────────────────────────────
  chromadb:
    image: chromadb/chroma:latest
    container_name: buildwise_chromadb
    volumes:
      - chroma_data:/chroma/chroma
    ports:
      - "8001:8000"
    environment:
      - IS_PERSISTENT=TRUE
      - ALLOW_RESET=TRUE
    networks:
      - buildwise_net

  # ── Ollama (LLM) ───────────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: buildwise_ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    networks:
      - buildwise_net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ── FastAPI Backend ─────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: buildwise_backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-buildwise}:${POSTGRES_PASSWORD:-buildwise_secret}@postgres:5432/${POSTGRES_DB:-buildwise_db}
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - OLLAMA_BASE_URL=http://ollama:11434
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-super-secret-jwt-key-change-in-production}
      - JWT_ALGORITHM=HS256
      - JWT_EXPIRE_MINUTES=1440
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ENVIRONMENT=${ENVIRONMENT:-development}
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
      - ml_models:/app/ml/models
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_started
    networks:
      - buildwise_net
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # ── Next.js Frontend ────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: buildwise_frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_APP_NAME=BuildWise AI
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - buildwise_net
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  postgres_data:
  chroma_data:
  ollama_data:
  uploads_data:
  ml_models:

networks:
  buildwise_net:
    driver: bridge
